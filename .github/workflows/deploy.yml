name: fincell.id CD — Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy_production:
    name: Deploy to Cloudflare (Worker, D1 & Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @fincell/shared build

      - name: Typecheck TypeScript
        run: pnpm --filter worker typecheck

      - name: Run unit & QA tests
        run: pnpm --filter worker test

      - name: Build Web application
        run: pnpm --filter web build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.fincell.id/api' }}
          VITE_STORE_NAME: ${{ vars.VITE_STORE_NAME || 'fincell.id' }}

      # ── D1 DATABASE MIGRATIONS ──
      - name: Apply Cloudflare D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply fincell-db-prod --remote --config apps/worker/wrangler.json

      # ── DEPLOY CLOUDFLARE WORKER ──
      - name: Deploy Cloudflare Worker API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/worker'
          command: 'deploy --env production'
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}

      # ── DEPLOY CLOUDFLARE PAGES ──
      - name: Deploy Frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy apps/web/dist --project-name=fincell-web --branch=main

      - name: Deployment Success Notification
        run: |
          echo "🚀 Production Deployment Completed Successfully!"
          echo "Main Web App: https://fincell.id"
          echo "Worker API: https://api.fincell.id"
